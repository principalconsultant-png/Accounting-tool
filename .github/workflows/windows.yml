name: Windows build
on: [workflow_dispatch, push]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
        env:
          RIJU_GUI_TEST: '1'
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name RijuBooks run_riju.py
      - name: Validate packaged Windows executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\dist\RijuBooks.exe -ArgumentList '--self-test-output packaged-selftest.json' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Packaged executable failed its self-test.' }
          if (-not (Test-Path packaged-selftest.json)) { throw 'No packaged self-test result.' }
          $result = Get-Content packaged-selftest.json -Raw | ConvertFrom-Json
          if (-not $result.passed) { throw 'Packaged self-test did not pass.' }
          $hash = (Get-FileHash .\dist\RijuBooks.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  RijuBooks.exe" | Set-Content .\dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RijuBooks-Windows
          path: |
            dist/RijuBooks.exe
            dist/SHA256SUMS.txt
            packaged-selftest.json
      - name: Publish versioned Windows download
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from riju import APP_VERSION; print(APP_VERSION)"
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; leaving it unchanged. Updated build remains in Actions artifacts."
          } else {
            gh release create $tag dist/RijuBooks.exe dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Riju Books $version" --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed. Download the verified executable from Actions artifacts.' }
          }
          exit 0
